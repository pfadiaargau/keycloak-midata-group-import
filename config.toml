# Configuration for import.py
# Credentials and URLs belong in .env, everything structural goes here.
# Another file can be used with `python3 import.py --config <file>`.

# Name or path of the Keycloak group to import into (e.g. "midata" or "extern/midata")
keycloak_group_root = "midata"

# Number of parallel requests to MIDATA (group names, events)
fetch_workers = 10


# ---------------------------------------------------------------------------
# Root groups
# Each root is imported including all its subgroups. The roots must be of the same type.
# - id:            MIDATA group ID
# - only_subtrees: optional, only import these groups including their subgroups.
#                  Their parent groups up to the root are imported as well, all others are not.
# - note:          optional, documentation only
# ---------------------------------------------------------------------------

[[roots]]
id = 4691
note = "Pfadi Aargau"

[[roots]]
id = 3
note = "Pfadi Kanton Solothurn: nur Kalei (11) > AG Ausbildung (22)"
only_subtrees = [22]


# ---------------------------------------------------------------------------
# Settings per specific MIDATA group (on top of the GroupTypeDefinition)
# - note:              optional, documentation only
# - role_subgroups:    false = no role subgroups, members end up in the "Rollen" folder
# - roles_add:         additional role subgroups (must be in allowed_roles of the type)
# - roles_remove:      roles from default_roles that get no subgroup
# - collections:       false = no collection groups (neither from the group type nor extra_collections)
# - extra_collections: additional collection groups. Anyone with one of the roles in this group
#                      or a group below it becomes a member. The same key overrides the
#                      collection from the group type.
#
# Example:
# [groups.400]
# roles_add = ["Group::Abteilung::Webmaster", "Group::Abteilung::Materialwart"]
# roles_remove = ["Group::Abteilung::Sekretariat"]
# [[groups.400.extra_collections]]
# key = "all_leaders"
# label = "Alle Leitenden"
# roles = ["Group::Woelfe::Einheitsleitung", "Group::Pfadi::Einheitsleitung"]
# ---------------------------------------------------------------------------

[groups.3]
note = "Pfadi Kanton Solothurn"
role_subgroups = false
collections = false

[groups.11]
note = "Kalei - Kantonale Leitung"
role_subgroups = false
collections = false

[groups.22]
note = "AG Ausbildung"
role_subgroups = false
collections = false


# ---------------------------------------------------------------------------
# Events
# [events.<MIDATA group ID>] contains lists with any name (here per year).
# - id:         event ID
# - short_name: optional, name of the group in Keycloak (default: course number, otherwise event name)
# - comment:    optional, stored as the attribute "comment" in Keycloak
# ---------------------------------------------------------------------------

